services:
  - type: web
    name: bookleaf-publishing-portal
    env: node
    plan: free
    buildCommand: "npm run install:all && npm run build"
    startCommand: "npm run seed && npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
