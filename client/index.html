<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookLeaf Publishing — Author Support & Operations</title>

    <!-- Google Fonts: Newsreader (serif) & IBM Plex Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Theme initialization script before DOM render to prevent white flash (Default: Light) -->
    <script>
      (function () {
        try {
          const stored = localStorage.getItem("theme");
          const theme = stored === "dark" ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #FCFAF6; color: #1F2421; font-family: 'IBM Plex Sans', -apple-system, sans-serif; padding: 24px; text-align: center;">
        <div style="width: 48px; height: 48px; border-radius: 8px; background-color: #2F5D50; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; box-shadow: 0 4px 12px rgba(47, 93, 80, 0.2);">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/>
            <path d="M6 6h10"/>
            <path d="M6 10h10"/>
          </svg>
        </div>
        <h2 style="font-family: 'Newsreader', Georgia, serif; font-size: 24px; font-weight: 600; margin: 0 0 8px 0; color: #1F2421;">
          BookLeaf Publishing
        </h2>
        <p style="font-size: 14px; color: #6B7280; max-width: 380px; margin: 0 0 20px 0; line-height: 1.5;">
          Author Support & Operations Desk Portal
        </p>
        <div style="display: flex; align-items: center; gap: 8px; background-color: #F4EBE1; border: 1px solid #E6DEC9; padding: 6px 14px; border-radius: 20px; font-size: 12px; color: #B5562F; font-weight: 500;">
          <span style="width: 6px; height: 6px; border-radius: 50%; background-color: #B5562F; display: inline-block;"></span>
          Initializing application (Hosted on Render Free Tier)
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
